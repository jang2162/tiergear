name: Publish to npm

# A published GitHub release (tag vX.Y.Z) publishes that version to npm.
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: GitHub's OIDC token stands in for an npm token, so no secret is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm test
      - run: npm run typecheck
      # prepack rebuilds dist; npm adds a provenance attestation on its own.
      - run: npm publish
